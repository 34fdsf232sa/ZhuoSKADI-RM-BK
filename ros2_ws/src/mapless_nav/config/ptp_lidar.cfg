# =============================================================================
# PTP/gPTP 配置 — 多 LiDAR 传感器时间同步
# =============================================================================
# ptp4l version: 3.1.1
#
# 硬件连接：
#   enp3s0 — LiDAR 数据面 (192.168.1.x/192.168.100.x 子网)
#   eno1   — 预留 (第二个 LiDAR 接口)
#
# 时间戳模式：
#   - 本机 enp3s0 无硬件 PTP 时钟，使用软件时间戳 (-S 参数)
#   - 精度 ~100μs-1ms，对 LiDAR 里程计足够
#
# LiDAR 固件要求：
#   - Unitree L2: SDK/AT 指令开启 PTP slave 模式
#   - Livox Mid-70: Livox Viewer → 设备设置 → PTP/gPTP 开启
#
# 启动：
#   sudo ptp4l -f ptp_lidar.cfg -i enp3s0 -S
# =============================================================================

[global]
# gPTP 域 (IEEE 802.1AS)
domainNumber            0

# 日志
logging_level           6
verbose                 1
use_syslog              0

# 时钟质量
priority1               128
priority2               128

# PTP over Ethernet (L2 transport)
network_transport       L2

# E2E 延迟测量
delay_mechanism         E2E

# 同步间隔 (2^-3 = 0.125s, 每秒 8 次同步)
logSyncInterval         -3
logMinDelayReqInterval  -3

# 静默启动
free_running            0

# 步长阈值 (1ns — 不做大步阶跃，用频率微调)
step_threshold          1

# 摘要日志间隔 (2^4 = 16s)
summary_interval        4

# PI 时钟控制
pi_proportional_const   0.0
pi_integral_const       0.0
pi_proportional_scale   0.0
pi_proportional_exponent -0.3
pi_proportional_norm_max 0.7
pi_integral_scale       0.0
pi_integral_exponent    -0.4
pi_integral_norm_max    0.3

# =============================================================================
# 端口配置 (取消注释以对特定接口使用特殊配置)
# =============================================================================
# [enp3s0]
# logAnnounceInterval      0
#
# [eno1]
# logAnnounceInterval      0
