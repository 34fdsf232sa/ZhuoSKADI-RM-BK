# =============================================================================
# Point Cloud Fusion Node Configuration
# =============================================================================

pointcloud_fusion_node:
  ros__parameters:
    # Input topics
    l2_topic: "/unilidar/cloud"
    mid70_topic: "/livox/lidar"
    depth_pc_topic: "/berxel/depth/points"
    
    # Output topic
    fused_topic: "/fused_pointcloud"
    
    # Target frame for fusion
    target_frame: "base_link"
    
    # Synchronization (PTP mode — all sensors on shared timebase)
    use_sync: true  # PTP-synced timestamps allow tight approximate time sync
    sync_queue_size: 10
    sync_slop: 0.02  # seconds tolerance — PTP should give sub-ms sync, 20ms slop
    publish_rate: 20.0  # Hz
    
    # Voxel filter (downsampling)
    enable_voxel_filter: true
    voxel_size: 0.05  # meters
    
    # Outlier removal
    enable_outlier_removal: true
    outlier_mean_k: 50
    outlier_stddev: 1.0
    
    # Range filter
    enable_range_filter: true
    min_range: 0.3  # meters
    max_range: 15.0  # meters
    
    # Height filter
    enable_height_filter: true
    min_height: -0.5  # meters relative to base_link
    max_height: 2.5  # meters
    
    # Ground removal
    enable_ground_removal: false
    ground_threshold: 0.2  # RANSAC threshold


# =============================================================================
# Depth to PointCloud Node Configuration
# =============================================================================

depth_to_pointcloud_node:
  ros__parameters:
    # Input topics
    depth_topic: "/berxel/depth/image_raw"
    camera_info_topic: "/berxel/depth/camera_info"
    
    # Output
    output_topic: "/berxel/depth/points"
    output_frame: "berxel_depth_optical_frame"
    
    # Berxel P100R intrinsics (defaults, will be overridden by camera_info)
    fx: 460.0
    fy: 460.0
    cx: 320.0
    cy: 240.0
    
    # Processing
    depth_scale: 0.001  # Convert mm to meters
    min_depth: 0.3
    max_depth: 5.0
    decimation: 2  # Downsample factor
    
    # Use camera_info if available
    use_camera_info: true
